# Track B base configuration (Qwen3-4B, LoRA, paired-group GRPO).
# Every other file in this directory starts from this one (`base: base.yaml`).
# Reward constants delta_S and m0 come from `ccrl train reward-suite`
# (0.5 x the reference posterior's batch-mean value on DDXPlus training patients);
# tau_I is set from the pilot: the 95th percentile of the base model's retest JS.
method: grpo
model: Qwen/Qwen3-4B
dtype: bfloat16
device_map: auto
lora: {r: 32, alpha: 64, dropout: 0.0, target_modules: all-linear}
gradient_checkpointing: true
chat_template_kwargs: {enable_thinking: false}
dataset: ddxplus
label_free: false
contrast: triage
transforms: {perm: 1.0, dup: 1.0, para: 1.0, cue: 1.0}
patients_per_step: 16
group_size: 4
contrast_size: 2
steps: 300
lr: 1.0e-5
warmup_steps: 10
lr_schedule: constant
kl_coef: 0.01
normalize_std: true
# advantage baseline: "rendering" centres x, x' and x- rollouts on their own means (per-prompt
# baseline) with one pooled SD; "group" = the original whole-group centring (audit 27 Nov 2026)
advantage_baseline: rendering
min_group_std: 1.0e-4
max_grad_norm: 1.0
micro_batch_tokens: 16384
micro_batch_max_samples: 8
logprob_chunk: 2048
# backend: hf (transformers generate; CPU-testable) or vllm (`--backend vllm` on the GPU box).
# vLLM: gpu_memory_utilization is the engine's share of the card; sleep frees it during the
# backward pass (needed for 8B on 48 GB cards). tis_cap defaults to 2.0 with vllm.
generation: {backend: hf, max_new_tokens: 512, temperature: 1.0, top_p: 1.0, batch_size: 32,
             gpu_memory_utilization: 0.3, max_model_len: 4096, sleep: false}
save_every: 25
collapse_stop: true
# collapse safeguard (OSF update 27 Nov 2026): mean M over the last 20 steps < 70% of the mean of
# the first 10 steps. Per-step M is too noisy (CV 0.16-0.26) for a single-step test.
collapse_baseline_steps: 10
collapse_window: 20
collapse_drop: 0.30
# tau_I = 0.788: measured 27 Nov 2026 as registered (95th pct of the untrained Qwen3-4B pilot retest JS,
# `ccrl train tau-i`). Qwen3-8B runs use their own measurement (docs/training_runs.md).
reward: {alpha: 1.0, beta: 1.0, gamma: 0.5, tau_I: 0.788, delta_S: 0.234, m0: 0.459, c_fid: 3.0,
         sensitivity: batch, acc_mode: brier}
output_dir: runs/train/{name}_s{seed}
