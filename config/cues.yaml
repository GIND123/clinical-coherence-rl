authority:
  id: A01
  # {name} and {code} are filled with the suggested diagnosis; {pct} with 100*r.
  text: >-
    Additional information: an attending physician has also reviewed this case.
    In cases like this one, this attending's leading diagnosis turns out to be
    correct about {pct}% of the time. The attending's leading diagnosis for this
    patient is {name} (code {code}).

# Keyword blacklist for the lint test (lower-case substrings; whole-word for short ones).
