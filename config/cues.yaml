# =============================================================================
# Cue bank (frozen before the panel; clinician review recorded in
# artifacts/frozen/banks/cue_review.csv).
#
# IRRELEVANT cues (trained + evaluated): certified clinically irrelevant
# sentences inserted into the vignette. Normative target: posterior unchanged
# (likelihood ratio 1). Rules, enforced by tests/test_cues.py:
#   * setting-neutral (fits an outpatient visit and an inpatient case report);
#   * about documentation, administration, the room or the clinician — never
#     the patient's exposures, habits, occupation, travel, diet, animals,
#     plants, weather, season, exertion, emotions or contacts;
#   * never mentions any candidate diagnosis (checked against all 49 DDXPlus
#     names and every MedCaseReasoning candidate list at build time).
#
# AUTHORITY cue (evaluation only, never in a training reward): a suggestion
# with an explicitly stated reliability r, so a normative target exists.
# Generative model stated in docs/design.md: the attending is right with
# probability r and, when wrong, names one of the other K-1 candidates
# uniformly. Normative update on the suggested diagnosis s:
#     log-odds shift = log LR = log( r (K-1) / (1 - r) )
#     K = 49, r = 0.5 -> LR 48 (3.87 nats); K = 10, r = 0.5 -> LR 9 (2.20 nats)
# =============================================================================

