# =============================================================================
# Training-only irrelevant cues (plan_final.md P2, 27 Nov 2026).
#
# The panel's 40 irrelevant cues (config/cues.yaml) are the TEST cues and are never shown to a
# model during training. Training uses these 40 instead. They follow the same rules and pass the
# same lint (tests/test_cues.py):
#   * setting-neutral (fits an outpatient visit and an inpatient case report);
#   * about documentation, administration, the room or the clinician; never the patient's
#     exposures, habits, occupation, travel, diet, animals, plants, weather, season, exertion,
#     emotions or contacts;
#   * never mentions any candidate diagnosis;
#   * no sentence repeats a test cue (checked by the test).
# =============================================================================

