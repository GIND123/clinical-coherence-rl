# =============================================================================
# Paid jobs. Each job = item set x transform set x models x effort levels.
# A request's identity is a hash of (job, item, model lock entry, effort,
# exact prompt text), so re-running a job only sends what has not completed.
#
# priority: A = confirmatory core; B = pre-registered secondary arms (run after
# A); C = optional exploratory (only if the C gate passes).
# Run order is enforced: a B job refuses to start while any A job is
# incomplete, unless --force-order is given.
# =============================================================================

jobs:
  pilot:
    priority: A
    description: 30 disjoint cases (20 DDXPlus + 10 MedCaseReasoning) x (10 calls + 1 schema variant) x 6 panel models
    item_set: pilot
    transform_set: pilot
    models: panel
    efforts: [default]

  panel_main:
    priority: A
    description: 600 cases (300 DDXPlus + 300 MedCaseReasoning) x 10 calls x 6 panel models (confirmatory)
    item_set: panel
    transform_set: all10
    models: panel
    efforts: [default]
    requires_completed: [pilot]

  panel_ext:
    priority: B
    description: replication sample, 300 further DDXPlus cases x 10 calls x 6 panel models
    item_set: panel_ext
    transform_set: all10
    models: panel
    efforts: [default]
    requires_completed: [panel_main]

  effort_arm:
    priority: B
    description: core 150 (75 + 75) x 6 calls x reasoning effort {low, medium, high} for gpt-oss-120b
    item_set: core
    transform_set: effort6
    models: [gpt-oss-120b]
    efforts: [low, medium, high]
    requires_completed: [panel_main]

  sequential:
    priority: B
    description: 150 DDXPlus cases x 2 orders x 2 turns x 6 panel models
    item_set: sequential
    transform_set: sequential
    models: panel
    efforts: [default]
    requires_completed: [panel_main]

  distill:
    priority: B
    description: 2,000 DDXPlus training renderings x Kimi K3 (teacher for the SFT-from-teacher baseline)
    item_set: distill
    transform_set: base_only
    models: [kimi-k3]
    efforts: [default]
    requires_completed: [panel_main]

  partner_panel:
    priority: C
    description: OPTIONAL exploratory - 600 panel cases x 10 calls x whichever partner models AWS enables
    item_set: panel
    transform_set: all10
    models: [opus-5.5, sonnet-5.5, gpt-6-sol, gpt-6-luna, grok-4.6]
    efforts: [default]
    skip_unavailable: true        # models without a passing probe are skipped, not an error
    requires_completed: [panel_main]

  # ------------------------------------------------------------------------
  # Amendment 1 (2026-11-18, after panel_main; docs/osf_amendment_1.md).
  # panel_main showed that most run-to-run variation is sampling noise at
  # provider-default decoding. These two arms separate noise from systematic
  # effects. Filed on OSF before they run and before any training.
  # ------------------------------------------------------------------------
  temp0:
    priority: B
    description: decoding robustness - core 150 (75 + 75) x 6 calls x 6 panel models at temperature 0
    item_set: core
    transform_set: effort6
    models: panel
    efforts: [default]
    temperature: 0.0
    requires_completed: [panel_main]

  resample:
    priority: B
    description: noise vs bias in evidence updating - 300 DDXPlus panel cases x (base, ablate) x 3 replicates x 6 models
    item_set: panel
    datasets: [ddxplus]
    transform_set: base_ablate
    replicates: 3
    models: panel
    efforts: [default]
    requires_completed: [panel_main]

  # ------------------------------------------------------------------------
  # Amendment 2 (2026-11-26, after the secondary arms; docs/amendment_2.md).
  # temp0 on the core 150 cases showed that removing most sampling noise
  # unmasks systematic order/paraphrase effects. These two arms test that on
  # the full confirmatory panel and on the replication sample. Kimi K3 is not
  # included: Bedrock rejects the temperature field for it.
  # The contamination probe (ccrl contamination run) is the third Amendment 2
  # arm; it is not an item-based job and is defined in ccrl/panel/contamination.py.
  # ------------------------------------------------------------------------
  temp0_panel:
    priority: B
    description: temperature 0 on the full panel - 600 cases x 10 calls x 5 models (Kimi K3 rejects temperature)
    item_set: panel
    transform_set: all10
    models: [glm-5, deepseek-v3.2, qwen3-next-80b, gpt-oss-120b, qwen3-32b]
    efforts: [default]
    temperature: 0.0
    requires_completed: [panel_main]

  temp0_ext:
    priority: B
    description: temperature 0 on the replication sample - 300 DDXPlus cases x 10 calls x 5 models
    item_set: panel_ext
    transform_set: all10
    models: [glm-5, deepseek-v3.2, qwen3-next-80b, gpt-oss-120b, qwen3-32b]
    efforts: [default]
    temperature: 0.0
    requires_completed: [panel_ext]
